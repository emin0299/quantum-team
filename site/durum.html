<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Başvurumu sorgula | Quantum Team</title>
  <meta name="description" content="Başvuru kodunla Quantum Team başvurunun durumunu ve mülakat bilgilerini öğren.">
  <meta name="theme-color" content="#0a0d24">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="img/logo-64.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/stil.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
  <script src="icerik.js" defer></script>
  <script src="js/site.js" defer></script>
</head>
<body data-sayfa="durum">
  <a class="atla" href="#icerik">İçeriğe geç</a>
  <header class="ust" data-ust data-ust-alan></header>

  <main id="icerik">
    <section class="sayfa-basi sayfa-basi--tam">
      <div class="kap dar">
        <p class="bolum__etiket">Başvuru takibi</p>
        <h1>Başvurumu sorgula</h1>
        <p class="sayfa-basi__metin">Onay mailinde sana özel bir başvuru kodu var. Kodu yazarak başvurunun durumunu ve mülakat bilgilerini görebilirsin.</p>
        <form class="sorgu" data-durum-form>
          <label class="gizli" for="kod">Başvuru kodu</label>
          <input id="kod" name="kod" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="QT-XXXXXX" maxlength="12" required>
          <button class="dugme dugme--buyuk" type="submit"><span data-ikon="arama"></span>Sorgula</button>
        </form>
        <div class="durum-sonuc" data-durum-sonuc aria-live="polite"></div>
        <p class="kucuk-not">Kodunu bulamıyor musun? Onay mailini "Quantum Team" diye arat ya da <a data-eposta-link></a> adresine yaz.</p>
      </div>
    </section>
  </main>

  <footer class="alt" id="iletisim" data-alt-alan></footer>
</body>
</html>
